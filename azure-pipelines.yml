trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: 'Build Stage (CI / PR Triggered)'

  jobs:
  - job: BuildJob
    displayName: 'Build Job'
    
    steps:
    - script: echo "Pipeline triggered by CI or PR"
      displayName: 'Run Build'
